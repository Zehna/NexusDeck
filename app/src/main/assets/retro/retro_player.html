    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05070E;
            color: #F8FAFC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
            touch-action: none;
        }
        #app-container {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        /* Top Status Bar */
        #top-bar {
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 11px;
            letter-spacing: 0.5px;
            z-index: 10;
        }
        #nexus-game-title {
            font-weight: 700;
            color: #38BDF8;
            max-width: 60%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .hud-badge {
            background: rgba(6, 182, 212, 0.15);
            color: #22D3EE;
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 600;
        }
        #nexus-status {
            color: #94A3B8;
            max-width: 34%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Full status / error banner (BIOS notice, load errors) */
        #nexus-note {
            padding: 6px 16px;
            font-size: 11px;
            line-height: 1.4;
            color: #FACC15;
            background: rgba(15, 23, 42, 0.9);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
        }
        /* Main Screen Container */
        #nexus-screen-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #020617;
        }
        #nexus-screen {
            image-rendering: pixelated;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.2);
            border-radius: 6px;
            width: min(100%, 720px);
            aspect-ratio: 3 / 2;
        }
        /* Virtual Controls Layer */
        #controls-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px 24px;
            z-index: 20;
        }
        .control-group {
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        /* D-Pad */
        .dpad-container {
            width: 140px;
            height: 140px;
            position: relative;
        }
        .nexus-btn {
            position: absolute;
            background: rgba(30, 41, 59, 0.7);
            border: 1.5px solid rgba(148, 163, 184, 0.3);
            color: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: transform 0.05s, background-color 0.05s;
        }
        .nexus-btn.active {
            background: rgba(6, 182, 212, 0.8) !important;
            border-color: #22D3EE !important;
            transform: scale(0.92);
        }
        .dpad-up { top: 0; left: 45px; width: 50px; height: 46px; border-radius: 8px 8px 0 0; }
        .dpad-down { bottom: 0; left: 45px; width: 50px; height: 46px; border-radius: 0 0 8px 8px; }
        .dpad-left { top: 45px; left: 0; width: 46px; height: 50px; border-radius: 8px 0 0 8px; }
        .dpad-right { top: 45px; right: 0; width: 46px; height: 50px; border-radius: 0 8px 8px 0; }
        .dpad-center { top: 45px; left: 45px; width: 50px; height: 50px; background: rgba(30, 41, 59, 0.9); }

        /* Action Buttons */
        .action-container {
            width: 140px;
            height: 140px;
            position: relative;
        }
        .btn-round {
            width: 52px;
            height: 52px;
            border-radius: 50%;
        }
        .btn-a { bottom: 44px; right: 0; background: rgba(168, 85, 247, 0.75); border-color: rgba(192, 132, 252, 0.5); }
        .btn-b { bottom: 0; left: 44px; background: rgba(236, 72, 153, 0.75); border-color: rgba(244, 114, 182, 0.5); }

        /* Shoulder Buttons */
        .shoulder-container {
            position: absolute;
            top: 48px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: none;
        }
        .btn-shoulder {
            pointer-events: auto;
            width: 76px;
            height: 36px;
            border-radius: 18px;
            background: rgba(30, 41, 59, 0.65);
            font-size: 12px;
        }

        /* Start / Select Buttons */
        .system-buttons {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            pointer-events: auto;
        }
        .btn-pill {
            width: 58px;
            height: 24px;
            border-radius: 12px;
            font-size: 10px;
            letter-spacing: 0.5px;
            background: rgba(30, 41, 59, 0.7);
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- Top HUD -->
        <div id="top-bar">
            <span id="nexus-game-title">NexusDeck Retro Player</span>
            <span id="nexus-core-name" class="hud-badge">IODINEGBA</span>
            <span id="nexus-status">Loading core...</span>
            <span id="nexus-fps" class="hud-badge" style="color: #10B981; border-color: rgba(16, 185, 129, 0.3);">-- FPS</span>
        </div>
        <div id="nexus-note">IodineGBA &bull; Audio off di v1.1.5 &bull; Saves hanya di memori sesi ini</div>

        <!-- Canvas: the real IodineGBA framebuffer target (240x160 native) -->
        <div id="nexus-screen-container">
            <canvas id="nexus-screen" width="240" height="160"></canvas>
        </div>

        <!-- Shoulder Controls -->
        <div class="shoulder-container">
            <button class="nexus-btn btn-shoulder" data-gba-index="9">L</button>
            <button class="nexus-btn btn-shoulder" data-gba-index="8">R</button>
        </div>

        <!-- Virtual Controls -->
        <div id="controls-layer">
            <!-- D-Pad -->
            <div class="control-group dpad-container">
                <button class="nexus-btn dpad-up" data-gba-index="6">&#9650;</button>
                <button class="nexus-btn dpad-down" data-gba-index="7">&#9660;</button>
                <button class="nexus-btn dpad-left" data-gba-index="5">&#9664;</button>
                <button class="nexus-btn dpad-right" data-gba-index="4">&#9654;</button>
                <div class="dpad-center"></div>
            </div>

            <!-- Start / Select -->
            <div class="system-buttons">
                <button class="nexus-btn btn-pill" data-gba-index="2">SELECT</button>
                <button class="nexus-btn btn-pill" data-gba-index="3">START</button>
            </div>

            <!-- Action Buttons -->
            <div class="control-group action-container">
                <button class="nexus-btn btn-round btn-b" data-gba-index="1">B</button>
                <button class="nexus-btn btn-round btn-a" data-gba-index="0">A</button>
            </div>
        </div>
    </div>

    <script>
        // GBA key indices (IodineGBA JoyPad): 0=A, 1=B, 2=Select, 3=Start,
        // 4=Right, 5=Left, 6=Up, 7=Down, 8=R, 9=L.
        window.addEventListener('DOMContentLoaded', function () {
            if (window.NexusIodine) {
                window.NexusIodine.init('nexus-screen');
            }
            var buttons = document.querySelectorAll('.nexus-btn[data-gba-index]');
            buttons.forEach(function (btn) {
                var index = parseInt(btn.getAttribute('data-gba-index'), 10);
                var down = function (e) {
                    e.preventDefault();
                    btn.classList.add('active');
                    if (window.NexusIodine) {
                        window.NexusIodine.keyDown(index);
                    }
                };
                var up = function (e) {
                    e.preventDefault();
                    btn.classList.remove('active');
                    if (window.NexusIodine) {
                        window.NexusIodine.keyUp(index);
                    }
                };
                btn.addEventListener('touchstart', down, { passive: false });
                btn.addEventListener('touchend', up, { passive: false });
                btn.addEventListener('touchcancel', up, { passive: false });
                btn.addEventListener('mousedown', down);
                btn.addEventListener('mouseup', up);
                btn.addEventListener('mouseleave', up);
            });
        });
    </script>
</body>
</html>
