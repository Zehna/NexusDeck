name: Build NexusDeck Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Test & Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          if ! ./gradlew testDebugUnitTest --info; then
            python3 -c "
          import glob, xml.etree.ElementTree as ET
          for xml_file in glob.glob('**/test-results/**/*.xml', recursive=True):
              tree = ET.parse(xml_file)
              for tc in tree.findall('.//testcase'):
                  fail = tc.find('failure')
                  if fail is not None:
                      msg = fail.get('message', '')
                      text = (fail.text or '').strip().split('\n')[0]
                      print(f'::error file={tc.get(\"classname\")}.kt,title={tc.get(\"name\")}::{msg} | {text}')
          "
            exit 1
          fi

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusDeck-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
