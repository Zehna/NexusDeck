name: Build NexusDeck Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Test & Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee build_log.txt || {
            echo "::error::Gradle command failed"
            grep -E "(e: |error:|FAILED)" build_log.txt | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Build Debug APK with Gradle
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee apk_log.txt || {
            echo "::error::Assemble APK failed"
            grep -E "(e: |error:|FAILED|FAILURE:|Exception)" apk_log.txt | head -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 60 apk_log.txt | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusDeck-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
